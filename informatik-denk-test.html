<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informatik-Denk-Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --papier:#fbfaf7;
    --karo:#cfe0ef;
    --karo-stark:#a9c8e2;
    --tinte:#15314f;
    --tinte-weich:#5b7690;
    --marker:#ff2f7e;
    --marker-blass:#ffd9e7;
    --gruen:#0f7a63;
    --rand:#e0574a;
    --grau:#e8e6e0;
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --lese:"Source Serif 4",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papier);
    background-image:
      linear-gradient(var(--karo) 1px,transparent 1px),
      linear-gradient(90deg,var(--karo) 1px,transparent 1px);
    background-size:24px 24px;
    color:var(--tinte);
    font-family:var(--lese);
    font-size:17px;
    line-height:1.55;
    min-height:100vh;
    padding:0 0 60px;
  }
  .blatt{max-width:1120px;margin:0 auto;padding:0 20px}

  /* ---------- Kopfzeile ---------- */
  header{
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    padding:28px 0 12px;border-bottom:2px solid var(--tinte);flex-wrap:wrap;
  }
  h1{
    font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,46px);
    letter-spacing:-.025em;margin:0;line-height:1;
  }
  .untertitel{font-size:15px;color:var(--tinte-weich);margin:6px 0 0}
  .fortschritt{display:flex;gap:7px;align-items:center;padding-bottom:6px}
  .fp{
    width:26px;height:26px;border:1.5px solid var(--tinte-weich);border-radius:50%;
    display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:700;
    color:var(--tinte-weich);background:transparent;
  }
  .fp.aktiv{background:var(--tinte);border-color:var(--tinte);color:var(--papier)}
  .fp.fertig{background:var(--marker-blass);border-color:var(--marker);color:var(--marker)}

  /* ---------- Bühne ---------- */
  .buehne{display:grid;grid-template-columns:1.25fr .9fr;gap:34px;margin-top:26px;align-items:start}
  @media(max-width:880px){.buehne{grid-template-columns:1fr;gap:22px}}

  .feld{
    position:relative;background:#fff;border:1.5px solid var(--karo-stark);
    box-shadow:3px 4px 0 rgba(21,49,79,.07);
  }
  .feld::before{
    content:"";position:absolute;left:30px;top:0;bottom:0;width:1px;background:var(--rand);opacity:.45;
  }
  svg.zeichenflaeche{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
  .kante-tinte{stroke:var(--tinte);stroke-width:.7;stroke-linecap:round}
  .kante-tinte.offen{stroke:var(--tinte-weich);stroke-dasharray:2.4 2.4;opacity:.75}
  .kante-marker{stroke:var(--marker);stroke-width:4.4;stroke-linecap:round;opacity:.42}
  .knoten{fill:#fff;stroke:var(--tinte);stroke-width:.7}
  .knoten.beruehrt{fill:var(--marker-blass)}
  .knoten.hier{fill:var(--marker);stroke:var(--marker)}
  .puls{fill:none;stroke:var(--marker);stroke-width:.7;opacity:.6}
  .gradzahl{font-family:var(--display);font-weight:700;font-size:4px;fill:var(--tinte);text-anchor:middle}
  .gradzahl.ungerade{fill:var(--marker)}
  .gummiband{stroke:var(--marker);stroke-width:1;stroke-dasharray:1.5 1.5;opacity:.8}
  @media(prefers-reduced-motion:no-preference){
    .puls{animation:puls 1.9s ease-out infinite}
    @keyframes puls{0%{r:3;opacity:.55}100%{r:7;opacity:0}}
    .geloest .kante-marker{animation:leuchten .7s ease-out}
    @keyframes leuchten{0%{opacity:.42;stroke-width:4.4}45%{opacity:.9;stroke-width:6.5}100%{opacity:.42;stroke-width:4.4}}
  }

  .meldung{
    margin-top:12px;min-height:30px;font-size:15.5px;padding:7px 12px;border-left:3px solid transparent;
  }
  .meldung.stockt{border-color:var(--rand);background:#fdf0ee}
  .meldung.gut{border-color:var(--gruen);background:#eaf5f2;color:var(--gruen)}
  .meldung.info{border-color:var(--karo-stark);background:#f2f7fb}

  /* ---------- Seitenspalte ---------- */
  .karte{background:#fff;border:1.5px solid var(--tinte);padding:20px 22px 22px;box-shadow:4px 5px 0 rgba(21,49,79,.1)}
  .nummer{font-family:var(--display);font-weight:500;font-size:13px;color:var(--tinte-weich);margin:0}
  h2{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.02em;margin:2px 0 10px;line-height:1.1}
  .auftrag{margin:0 0 16px}
  .regeln{border-top:1px dotted var(--karo-stark);padding-top:13px;margin:0;font-size:15px;color:var(--tinte-weich)}
  .regeln li{margin-bottom:3px}
  .regeln ul{margin:6px 0 0;padding-left:18px}

  .zaehlerreihe{display:flex;align-items:center;gap:16px;margin:18px 0 14px;border-top:1px dotted var(--karo-stark);padding-top:14px}
  .zaehler{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
  .zaehler-text{font-size:14px;color:var(--tinte-weich);line-height:1.25}

  button{font-family:var(--display);font-size:15px;font-weight:700;cursor:pointer;border-radius:0}
  .knopf{
    background:var(--tinte);color:var(--papier);border:1.5px solid var(--tinte);
    padding:9px 16px;transition:transform .08s ease;
  }
  .knopf:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--marker)}
  .knopf.leer{background:#fff;color:var(--tinte)}
  .knopf.leer:hover{box-shadow:2px 2px 0 var(--tinte-weich)}
  .knopf.aktiv{background:var(--marker);border-color:var(--marker);color:#fff}
  .knopf:focus-visible,a:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
  .knopfreihe{display:flex;flex-wrap:wrap;gap:9px}

  .frage{margin-top:18px;border-top:2px solid var(--tinte);padding-top:16px}
  .frage p.text{margin:0 0 12px;font-weight:600}
  .wahl{
    display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--karo-stark);
    padding:10px 13px;margin-bottom:8px;font-family:var(--lese);font-size:16px;font-weight:400;color:var(--tinte);
  }
  .wahl:hover{border-color:var(--tinte)}
  .wahl.falsch{border-color:var(--rand);background:#fdf0ee}
  .wahl.richtig{border-color:var(--gruen);background:#eaf5f2}
  textarea{
    width:100%;min-height:96px;font-family:var(--lese);font-size:16px;padding:10px;
    border:1.5px solid var(--karo-stark);background:#fff;color:var(--tinte);resize:vertical;
  }
  textarea:focus{outline:2px solid var(--marker);border-color:var(--marker)}
  .rueckmeldung{margin-top:11px;font-size:15.5px;padding:9px 12px;border-left:3px solid var(--gruen);background:#eaf5f2}
  .rueckmeldung.nein{border-color:var(--rand);background:#fdf0ee}

  .werkzeugleiste{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .ablesung{font-family:var(--display);font-weight:700;font-size:15px;margin-left:auto}
  .ablesung span{color:var(--marker)}

  /* ---------- Start & Auflösung ---------- */
  .start{max-width:660px;margin:9vh auto 0;text-align:left}
  .start h1{font-size:clamp(38px,8vw,72px)}
  .start .marker{
    background:linear-gradient(transparent 58%,var(--marker-blass) 58%,var(--marker-blass) 94%,transparent 94%);
  }
  .start p{font-size:18px;max-width:52ch}
  .aufloesung{max-width:780px;margin:0 auto}
  .begriffe{list-style:none;padding:0;margin:20px 0 0;border-top:2px solid var(--tinte)}
  .begriffe li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:12px 0;border-bottom:1px dotted var(--karo-stark)}
  .begriffe b{font-family:var(--display);font-size:18px}
  @media(max-width:620px){.begriffe li{grid-template-columns:1fr;gap:2px}}
  table.protokoll{width:100%;border-collapse:collapse;margin-top:14px;font-size:15.5px}
  table.protokoll th,table.protokoll td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--karo-stark);vertical-align:top}
  table.protokoll th{font-family:var(--display);font-size:14px;color:var(--tinte-weich);font-weight:700}
  table.protokoll td.n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
  @media print{
    body{background:#fff}
    .keindruck{display:none!important}
    .karte{box-shadow:none}
  }
</style>
</head>
<body>
<div class="blatt" id="app"></div>

<script>
"use strict";

/* =======================================================================
   FIGUREN
   Koordinaten im Bereich 0..100. "loesbar" beschreibt, ob ein Zug
   existiert, der jeden Strich genau einmal benutzt (Eulerweg).
   ======================================================================= */

const STUFEN = [
  {
    id:"s1", level:1, titel:"Die Schleife", loesbar:true,
    auftrag:"Fahre die Figur in einem Zug nach: Wähle einen Punkt, halte die Maustaste gedrückt und ziehe von Punkt zu Punkt.",
    knoten:[[12,22],[12,74],[50,48],[88,22],[88,74]],
    kanten:[[0,1],[1,2],[2,0],[3,4],[4,2],[2,3]],
    danach:[{
      art:"mc",
      text:"Spielt es bei dieser Figur eine Rolle, an welchem Punkt du startest?",
      optionen:["Ja, nur ein Start führt zum Ziel.","Nein, jeder Start führt zum Ziel.","Nur die äußeren Punkte funktionieren."],
      richtig:1,
      ja:"Richtig. Hier gelingt es von jedem Punkt aus. Merke dir diese Beobachtung – sie wird gleich wichtig.",
      nein:"Noch nicht. Starte die Figur neu und probiere bewusst einen anderen Punkt aus."
    }]
  },
  {
    id:"s2", level:2, titel:"Das Haus", loesbar:true,
    auftrag:"Untersuche, von welchen Punkten aus es gelingt. Starte dazu mehrmals an unterschiedlichen Stellen.",
    knoten:[[15,86],[85,86],[85,46],[15,46],[50,12]],
    kanten:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[3,4],[4,2]],
    danach:[{
      art:"mc",
      text:"Von welchen Punkten aus gelingt diese Figur?",
      optionen:["Von jedem Punkt aus.","Nur von den beiden unteren Ecken.","Nur von der Spitze."],
      richtig:1,
      ja:"Genau. Nur die beiden unteren Ecken funktionieren – bei der Schleife vorher war noch jeder Start erlaubt. Irgendetwas unterscheidet diese beiden Figuren.",
      nein:"Prüfe das nach: Starte die Figur neu und teste die Spitze und eine obere Ecke."
    }]
  },
  {
    id:"s3", level:3, titel:"Das Haus mit Keller", loesbar:true,
    auftrag:"Bestimme vor dem Zeichnen, wo du starten musst. Überprüfe deine Vermutung anschließend.",
    knoten:[[15,72],[85,72],[85,38],[15,38],[50,8],[50,94]],
    kanten:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[3,4],[4,2],[0,5],[5,1]],
    danach:[{
      art:"mc",
      text:"Wie viele Startpunkte führen bei dieser Figur zum Ziel?",
      optionen:["Nur einer.","Genau zwei.","Alle."],
      richtig:2,
      ja:"Stimmt. Zwei zusätzliche Striche unten – und plötzlich ist jeder Start wieder erlaubt. Die Anzahl der Striche an den Punkten scheint eine Rolle zu spielen.",
      nein:"Teste es: Starte neu und versuche es von der Spitze und von einer oberen Ecke aus."
    }]
  },
  {
    id:"s4", level:4, titel:"Der Anbau", loesbar:false, behauptungAb:4,
    auftrag:"Dieselbe Idee, ein Strich mehr im Dach. Versuche es – und melde dich über den Button, wenn du einen Verdacht hast.",
    knoten:[[15,86],[85,86],[85,46],[15,46],[50,12],[18,16]],
    kanten:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[3,4],[4,2],[3,5],[5,4]],
    danach:[{
      art:"text",
      text:"Begründe, warum diese Figur nicht in einem Zug zu schaffen ist.",
      platzhalter:"Schreibe deine Vermutung in ganzen Sätzen auf …",
      ja:"Deine Begründung ist gespeichert. Ein Hinweis für den nächsten Schritt: Schau dir genau an, wie viele Striche an den einzelnen Punkten zusammenlaufen."
    }]
  },
  {
    id:"s5a", level:5, teil:"1 von 3", titel:"Drei kleine Netze", loesbar:true, zaehlwerkzeug:true, behauptungAb:0,
    auftrag:"Ab jetzt hilft dir das Zähl-Werkzeug: Es zeigt dir, wie viele Striche an jedem Punkt zusammenlaufen. Sage zuerst voraus, ob die Figur lösbar ist.",
    knoten:[[20,78],[80,78],[80,26],[20,26]],
    kanten:[[0,1],[1,2],[2,3],[3,0],[0,2]],
    vorher:[{
      art:"mc",
      text:"Deine Vorhersage für dieses Netz:",
      optionen:["Lösbar","Nicht lösbar"],
      richtig:0,
      ja:"Notiert. Zeig es jetzt.",
      nein:"Notiert – zeichne trotzdem und schau, was passiert.",
      immerWeiter:true
    }]
  },
  {
    id:"s5b", level:5, teil:"2 von 3", titel:"Drei kleine Netze", loesbar:false, zaehlwerkzeug:true, behauptungAb:0,
    auftrag:"Ein Strich mehr als eben. Zähle wieder nach, bevor du zeichnest.",
    knoten:[[20,78],[80,78],[80,26],[20,26]],
    kanten:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3]],
    vorher:[{
      art:"mc",
      text:"Deine Vorhersage für dieses Netz:",
      optionen:["Lösbar","Nicht lösbar"],
      richtig:1,
      ja:"Notiert. Beweise es, indem du es versuchst oder die Unmöglichkeit meldest.",
      nein:"Notiert – versuche es und schau, wie weit du kommst.",
      immerWeiter:true
    }]
  },
  {
    id:"s5c", level:5, teil:"3 von 3", titel:"Drei kleine Netze", loesbar:true, zaehlwerkzeug:true, behauptungAb:6,
    auftrag:"Das letzte der drei Netze. Zehn Striche – lass dich vom Aussehen nicht täuschen.",
    knoten:[[50,8],[88,36],[74,80],[26,80],[12,36]],
    kanten:[[0,1],[0,2],[0,3],[0,4],[1,2],[1,3],[1,4],[2,3],[2,4],[3,4]],
    vorher:[{
      art:"mc",
      text:"Deine Vorhersage für dieses Netz:",
      optionen:["Lösbar","Nicht lösbar"],
      richtig:0,
      ja:"Notiert. Jetzt bist du dran.",
      nein:"Notiert – zeichne trotzdem und prüfe deine Vorhersage.",
      immerWeiter:true
    }]
  },
  {
    id:"s6", level:6, titel:"Die Siedlung", loesbar:true, zaehlwerkzeug:true, behauptungAb:8,
    auftrag:"Wende deine Regel auf ein großes Netz an, das du noch nie gesehen hast. 17 Striche – der längste Zug des Tests.",
    knoten:[[8,82],[40,82],[40,48],[8,48],[24,18],[60,82],[92,82],[92,48],[60,48],[76,18]],
    kanten:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[3,4],[4,2],
            [5,6],[6,7],[7,8],[8,5],[5,7],[6,8],[8,9],[9,7],[1,5]],
    vorher:[
      {
        art:"mc",
        text:"Welche Regel passt zu allem, was du bisher beobachtet hast?",
        optionen:[
          "Eine Figur ist lösbar, wenn sie gleich viele Punkte wie Striche hat.",
          "Eine Figur ist lösbar, wenn kein einziger oder genau zwei Punkte eine ungerade Anzahl Striche haben.",
          "Eine Figur ist lösbar, wenn an jedem Punkt eine ungerade Anzahl Striche zusammenläuft.",
          "Eine Figur ist lösbar, wenn sie höchstens zehn Striche hat."
        ],
        richtig:1,
        ja:"Das ist die Regel. Null ungerade Punkte: Start überall. Genau zwei: Start an einem der beiden. Mehr als zwei: unmöglich.",
        nein:"Das passt nicht zu deinen Beobachtungen. Denk an Aufgabe 1 (jeder Start erlaubt), Aufgabe 2 (nur zwei Startpunkte) und Aufgabe 4 (gar keiner)."
      },
      {
        art:"mc",
        text:"Wo musst du in dieser Siedlung starten?",
        optionen:["Egal, überall.","An einer der beiden äußeren unteren Ecken.","An einer der beiden Dachspitzen."],
        richtig:1,
        ja:"Richtig – zähle ruhig mit dem Werkzeug nach. Genau diese zwei Punkte sind ungerade.",
        nein:"Zähl mit dem Werkzeug nach, an welchen Punkten eine ungerade Anzahl Striche zusammenläuft."
      }
    ]
  },
  {
    id:"s7", level:7, titel:"Selbst gebaut", bauen:true,
    auftrag:"Entwirf selbst ein Netz, das garantiert niemand in einem Zug schafft: Es soll genau vier ungerade Punkte haben, mindestens sechs Punkte und acht Striche, und alles muss zusammenhängen."
  }
];

const LEVELANZAHL = 7;

/* =======================================================================
   ZUSTAND
   ======================================================================= */

const zustand = {
  ansicht:"start",       // start | stufe | aufloesung
  index:0,
  versuche:{},           // stufenId -> Anzahl
  antworten:{},          // stufenId -> [{frage, antwort, richtig}]
  phase:"vorher",        // vorher | zeichnen | danach
  frageNr:0,
  benutzt:new Set(),
  pfad:[],
  aktuell:null,
  zieht:false,
  gezaehlt:false,
  zeigerXY:null,
  zaehlmodus:false,
  geloest:false,
  meldung:null,
  bauModus:"punkt",
  bauKnoten:[],
  bauKanten:[],
  bauFertig:false
};

const app = document.getElementById("app");
const stufe = () => STUFEN[zustand.index];

function versucheVon(id){ return zustand.versuche[id] || 0; }
function antwortSpeichern(id,eintrag){
  if(!zustand.antworten[id]) zustand.antworten[id] = [];
  zustand.antworten[id].push(eintrag);
}

/* =======================================================================
   GRAPH-HILFSFUNKTIONEN
   ======================================================================= */

function grade(knoten,kanten){
  const g = knoten.map(() => 0);
  kanten.forEach(([a,b]) => { g[a]++; g[b]++; });
  return g;
}
function ungeradeAnzahl(knoten,kanten){
  return grade(knoten,kanten).filter(d => d % 2 === 1).length;
}
function zusammenhaengend(knoten,kanten){
  if(knoten.length === 0) return false;
  const nachbarn = knoten.map(() => []);
  kanten.forEach(([a,b]) => { nachbarn[a].push(b); nachbarn[b].push(a); });
  if(nachbarn.some(n => n.length === 0)) return false;
  const gesehen = new Set([0]);
  const stapel = [0];
  while(stapel.length){
    const k = stapel.pop();
    for(const n of nachbarn[k]) if(!gesehen.has(n)){ gesehen.add(n); stapel.push(n); }
  }
  return gesehen.size === knoten.length;
}

/* =======================================================================
   DARSTELLUNG
   ======================================================================= */

function el(tag,attrs={},kinder=[]){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === "class") n.className = v;
    else if(k === "html") n.innerHTML = v;
    else if(k === "text") n.textContent = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  (Array.isArray(kinder) ? kinder : [kinder]).forEach(c => c && n.appendChild(c));
  return n;
}
function svgEl(tag,attrs={}){
  const n = document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
  return n;
}

// Verweise auf lebende DOM-Knoten. Die Zeichenfläche darf während eines
// Mauszugs nicht ersetzt werden, sonst reißt der Zeigerkontakt ab.
const refs = {svgInhalt:null,panel:null,meldung:null};

function zeichnen(){
  refs.svgInhalt = null; refs.panel = null; refs.meldung = null; letzteSignatur = "";
  app.innerHTML = "";
  if(zustand.ansicht === "start") return startSeite();
  if(zustand.ansicht === "aufloesung") return aufloesungsSeite();
  kopfzeile();
  const b = el("div",{class:"buehne"});
  b.appendChild(stufe().bauen ? bauFeld() : spielFeld());
  refs.panel = seitenSpalte();
  b.appendChild(refs.panel);
  app.appendChild(b);
}

// Leichte Aktualisierung während des Zeichnens: Die Zeichenfläche wird immer
// neu befüllt, die Seitenspalte nur, wenn sich inhaltlich etwas geändert hat.
let letzteSignatur = "";
function aktualisieren(){
  if(refs.svgInhalt) refs.svgInhalt();
  const s = stufe();
  const sig = [zustand.benutzt.size,versucheVon(s.id),zustand.geloest,zustand.bauFertig,
               zustand.bauKnoten.length,zustand.bauKanten.length,
               zustand.meldung ? zustand.meldung.text : ""].join("|");
  if(sig === letzteSignatur) return;
  letzteSignatur = sig;
  if(refs.panel){ const neu = seitenSpalte(); refs.panel.replaceWith(neu); refs.panel = neu; }
  if(refs.meldung){ const neu = meldungsZeile(); refs.meldung.replaceWith(neu); refs.meldung = neu; }
}

/* ---------- Startseite ---------- */
function startSeite(){
  const wrap = el("div",{class:"start"});
  wrap.appendChild(el("h1",{html:'Informatik-<span class="marker">Denk-Test</span>'}));
  wrap.appendChild(el("p",{text:"Sieben Figuren. Du fährst jede mit der Maus nach – jeden Strich genau einmal, ohne den Stift abzusetzen. Manche gelingen sofort. Eine ist unmöglich. Deine Aufgabe ist es herauszufinden, woran man das vorher erkennt."}));
  wrap.appendChild(el("p",{text:"Es gibt nichts abzugeben und nichts zu verlieren. Der Versuchszähler zählt nur mit, er bewertet nicht.",style:"color:var(--tinte-weich);font-size:16px"}));
  wrap.appendChild(el("div",{class:"knopfreihe",style:"margin-top:26px"},[
    el("button",{class:"knopf",text:"Test starten",onclick:() => { zustand.ansicht = "stufe"; stufeStarten(0); }})
  ]));
  app.appendChild(wrap);
}

/* ---------- Kopfzeile ---------- */
function kopfzeile(){
  const links = el("div",{},[
    el("h1",{text:"Informatik-Denk-Test"}),
    el("p",{class:"untertitel",text:"Jeden Strich genau einmal. Ohne abzusetzen."})
  ]);
  const punkte = el("div",{class:"fortschritt"});
  for(let i = 1; i <= LEVELANZAHL; i++){
    const aktuellesLevel = stufe().level;
    const klasse = i === aktuellesLevel ? "fp aktiv" : (i < aktuellesLevel ? "fp fertig" : "fp");
    punkte.appendChild(el("div",{class:klasse,text:String(i)}));
  }
  app.appendChild(el("header",{},[links,punkte]));
}

/* ---------- Zeichenfläche ---------- */
function spielFeld(){
  const s = stufe();
  const feld = el("div",{class:"feld"});
  const svg = svgEl("svg",{viewBox:"0 0 100 100",class:"zeichenflaeche"});
  refs.svgInhalt = () => fuelleSVG(svg,s);
  fuelleSVG(svg,s);
  zeigerLogik(svg,s);
  feld.appendChild(svg);
  const aussen = el("div",{});
  aussen.appendChild(feld);
  if(s.zaehlwerkzeug) aussen.appendChild(zaehlLeiste(s));
  refs.meldung = meldungsZeile();
  aussen.appendChild(refs.meldung);
  return aussen;
}

function fuelleSVG(svg,s){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.classList.toggle("geloest",zustand.geloest);

  // Markerspur (liegt unter der Tinte)
  zustand.benutzt.forEach(i => {
    const [a,b] = s.kanten[i];
    svg.appendChild(svgEl("line",{
      x1:s.knoten[a][0],y1:s.knoten[a][1],x2:s.knoten[b][0],y2:s.knoten[b][1],class:"kante-marker"
    }));
  });
  // Tintenfigur
  s.kanten.forEach(([a,b],i) => {
    svg.appendChild(svgEl("line",{
      x1:s.knoten[a][0],y1:s.knoten[a][1],x2:s.knoten[b][0],y2:s.knoten[b][1],
      class:"kante-tinte"+(zustand.benutzt.has(i) ? "" : " offen")
    }));
  });
  // Gummiband
  if(zustand.zieht && zustand.aktuell !== null && zustand.zeigerXY){
    svg.appendChild(svgEl("line",{
      x1:s.knoten[zustand.aktuell][0],y1:s.knoten[zustand.aktuell][1],
      x2:zustand.zeigerXY[0],y2:zustand.zeigerXY[1],class:"gummiband"
    }));
  }
  // Knoten
  const g = grade(s.knoten,s.kanten);
  s.knoten.forEach(([x,y],i) => {
    if(zustand.aktuell === i && !zustand.geloest) svg.appendChild(svgEl("circle",{cx:x,cy:y,r:3,class:"puls"}));
    const klasse = zustand.aktuell === i ? "knoten hier" : (zustand.pfad.includes(i) ? "knoten beruehrt" : "knoten");
    svg.appendChild(svgEl("circle",{cx:x,cy:y,r:2.3,class:klasse,"data-k":i}));
    if(zustand.zaehlmodus){
      const kreis = svgEl("circle",{cx:x + 5.5,cy:y - 5,r:3.1,fill:"#fff",stroke:g[i] % 2 ? "var(--marker)" : "var(--tinte-weich)","stroke-width":.6});
      svg.appendChild(kreis);
      const t = svgEl("text",{x:x + 5.5,y:y - 3.6,class:"gradzahl"+(g[i] % 2 ? " ungerade" : "")});
      t.textContent = g[i];
      svg.appendChild(t);
    }
  });
}

function zaehlLeiste(s){
  const g = grade(s.knoten,s.kanten);
  const u = g.filter(d => d % 2 === 1).length;
  const leiste = el("div",{class:"werkzeugleiste",style:"margin-top:12px"});
  leiste.appendChild(el("button",{
    class:"knopf leer"+(zustand.zaehlmodus ? " aktiv" : ""),
    text:zustand.zaehlmodus ? "Zählen beenden" : "Punkte zählen",
    onclick:() => { zustand.zaehlmodus = !zustand.zaehlmodus; zeichnen(); }
  }));
  if(zustand.zaehlmodus){
    leiste.appendChild(el("div",{class:"ablesung",html:"Ungerade Punkte: <span>" + u + "</span>"}));
  }
  return leiste;
}

function meldungsZeile(){
  const m = zustand.meldung;
  return el("div",{class:"meldung" + (m ? " " + m.art : ""),text:m ? m.text : ""});
}

function zeigerLogik(svg,s){
  const zuViewBox = (evt) => {
    const r = svg.getBoundingClientRect();
    return [(evt.clientX - r.left) / r.width * 100,(evt.clientY - r.top) / r.height * 100];
  };
  const knotenBei = ([x,y]) => {
    let treffer = null, best = 7;
    s.knoten.forEach(([kx,ky],i) => {
      const d = Math.hypot(kx - x,ky - y);
      if(d < best){ best = d; treffer = i; }
    });
    return treffer;
  };
  const gesperrt = () => zustand.phase !== "zeichnen" || zustand.zaehlmodus || zustand.geloest;

  svg.addEventListener("pointerdown",(e) => {
    if(gesperrt()) return;
    const k = knotenBei(zuViewBox(e));
    if(k === null) return;
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    zustand.zieht = true;
    if(zustand.aktuell === null){ starteBei(k); }
    else if(k !== zustand.aktuell){ versucheKante(k); }
    aktualisieren();
  });
  svg.addEventListener("pointermove",(e) => {
    if(!zustand.zieht || zustand.aktuell === null || gesperrt()) return;
    const p = zuViewBox(e);
    zustand.zeigerXY = p;
    const k = knotenBei(p);
    if(k !== null && k !== zustand.aktuell) versucheKante(k);
    aktualisieren();
  });
  const ende = () => { zustand.zieht = false; zustand.zeigerXY = null; aktualisieren(); };
  svg.addEventListener("pointerup",ende);
  svg.addEventListener("pointercancel",ende);
}

function starteBei(k){
  zustand.aktuell = k;
  zustand.pfad = [k];
  zustand.meldung = null;
}

function versucheKante(ziel){
  const s = stufe();
  const idx = s.kanten.findIndex(([a,b],i) =>
    !zustand.benutzt.has(i) && ((a === zustand.aktuell && b === ziel) || (b === zustand.aktuell && a === ziel))
  );
  if(idx === -1) return;
  zustand.benutzt.add(idx);
  zustand.aktuell = ziel;
  zustand.pfad.push(ziel);
  pruefen();
}

function pruefen(){
  const s = stufe();
  if(zustand.benutzt.size === s.kanten.length){
    zustand.geloest = true;
    zustand.zieht = false;
    zustand.meldung = {art:"gut",text:"Geschafft – alle Striche genau einmal."};
    return;
  }
  const weiter = s.kanten.some(([a,b],i) =>
    !zustand.benutzt.has(i) && (a === zustand.aktuell || b === zustand.aktuell)
  );
  if(!weiter){
    zustand.versuche[s.id] = versucheVon(s.id) + 1;
    zustand.gezaehlt = true;
    zustand.meldung = {art:"stockt",text:"Festgefahren: Von hier führt kein unbenutzter Strich mehr weiter. Starte neu."};
  }
}

function neuStarten(zaehlen){
  const s = stufe();
  if(zaehlen && zustand.benutzt.size > 0 && !zustand.geloest && !zustand.gezaehlt){
    zustand.versuche[s.id] = versucheVon(s.id) + 1;
  }
  zustand.gezaehlt = false;
  zustand.benutzt = new Set();
  zustand.pfad = [];
  zustand.aktuell = null;
  zustand.zieht = false;
  zustand.meldung = null;
  zeichnen();
}

/* ---------- Seitenspalte ---------- */
function seitenSpalte(){
  const s = stufe();
  const karte = el("div",{class:"karte"});
  karte.appendChild(el("p",{class:"nummer",text:"Aufgabe " + s.level + (s.teil ? " · Netz " + s.teil : "")}));
  karte.appendChild(el("h2",{text:s.titel}));
  karte.appendChild(el("p",{class:"auftrag",text:s.auftrag}));

  if(!s.bauen){
    karte.appendChild(el("div",{class:"regeln",html:
      "Es gilt durchgehend:<ul><li>Jeder Strich genau einmal.</li><li>Den Stift nicht absetzen.</li><li>Punkte darfst du mehrfach besuchen.</li></ul>"}));
  }

  if(zustand.phase === "vorher"){
    karte.appendChild(frageBlock(s.vorher[zustand.frageNr],"vorher"));
    return karte;
  }
  if(zustand.phase === "danach"){
    karte.appendChild(frageBlock(s.danach[zustand.frageNr],"danach"));
    return karte;
  }

  // Phase: zeichnen
  if(!s.bauen){
    const reihe = el("div",{class:"zaehlerreihe"});
    reihe.appendChild(el("div",{class:"zaehler",text:String(versucheVon(s.id)).padStart(2,"0")}));
    reihe.appendChild(el("div",{class:"zaehler-text",text:versucheVon(s.id) === 1 ? "Versuch bisher" : "Versuche bisher"}));
    karte.appendChild(reihe);
  }

  const knoepfe = el("div",{class:"knopfreihe"});
  if(s.bauen){
    knoepfe.appendChild(el("button",{class:"knopf",text:"Netz prüfen",onclick:bauPruefen}));
    knoepfe.appendChild(el("button",{class:"knopf leer",text:"Alles löschen",onclick:() => {
      zustand.bauKnoten = []; zustand.bauKanten = []; zustand.bauFertig = false;
      zustand.meldung = null; zeichnen();
    }}));
    if(zustand.bauFertig){
      knoepfe.appendChild(el("button",{class:"knopf",text:"Zur Auflösung",
        onclick:() => { zustand.ansicht = "aufloesung"; zeichnen(); }}));
    }
  } else {
    knoepfe.appendChild(el("button",{class:"knopf leer",text:"Neu starten",onclick:() => neuStarten(true)}));
    const schwelle = s.behauptungAb;
    const zeigen = typeof schwelle === "number" && versucheVon(s.id) >= schwelle;
    if(zeigen && !zustand.geloest){
      knoepfe.appendChild(el("button",{class:"knopf leer",text:"Ich behaupte: unmöglich",onclick:behauptungPruefen}));
    }
    if(zustand.geloest){
      knoepfe.appendChild(el("button",{class:"knopf",text:"Weiter",onclick:weiter}));
    }
  }
  karte.appendChild(knoepfe);
  return karte;
}

function behauptungPruefen(){
  const s = stufe();
  if(s.loesbar){
    zustand.meldung = {art:"info",text:"Diese Figur lässt sich lösen. Starte neu und probiere einen anderen Punkt als Anfang."};
    zeichnen();
    return;
  }
  zustand.geloest = true;
  zustand.meldung = {art:"gut",text:"Richtig erkannt. Diese Figur ist tatsächlich unmöglich – und das lässt sich beweisen."};
  antwortSpeichern(s.id,{frage:"Behauptung",antwort:"unmöglich",richtig:true});
  zeichnen();
}

/* ---------- Fragen ---------- */
function frageBlock(frage,wo){
  const kasten = el("div",{class:"frage"});
  kasten.appendChild(el("p",{class:"text",text:frage.text}));

  if(frage.art === "text"){
    const feld = el("textarea",{placeholder:frage.platzhalter || ""});
    kasten.appendChild(feld);
    kasten.appendChild(el("div",{class:"knopfreihe",style:"margin-top:10px"},[
      el("button",{class:"knopf",text:"Antwort speichern",onclick:() => {
        const wert = feld.value.trim();
        if(wert.length < 10){
          const w = kasten.querySelector(".rueckmeldung") || el("div",{class:"rueckmeldung nein"});
          w.className = "rueckmeldung nein";
          w.textContent = "Schreibe bitte mindestens einen vollständigen Satz.";
          kasten.appendChild(w);
          return;
        }
        antwortSpeichern(stufe().id,{frage:frage.text,antwort:wert,richtig:null});
        const w = el("div",{class:"rueckmeldung",text:frage.ja});
        kasten.appendChild(w);
        kasten.appendChild(el("div",{class:"knopfreihe",style:"margin-top:12px"},[
          el("button",{class:"knopf",text:"Weiter",onclick:() => frageFertig(wo)})
        ]));
        feld.disabled = true;
      }})
    ]));
    return kasten;
  }

  frage.optionen.forEach((text,i) => {
    kasten.appendChild(el("button",{class:"wahl",text:text,onclick:(e) => {
      const richtig = i === frage.richtig;
      e.currentTarget.classList.add(richtig ? "richtig" : "falsch");
      const alt = kasten.querySelector(".rueckmeldung");
      if(alt) alt.remove();
      const w = el("div",{class:"rueckmeldung" + (richtig ? "" : " nein"),text:richtig ? frage.ja : frage.nein});
      kasten.appendChild(w);
      antwortSpeichern(stufe().id,{frage:frage.text,antwort:text,richtig:richtig});
      if(richtig || frage.immerWeiter){
        kasten.querySelectorAll(".wahl").forEach(b => b.disabled = true);
        kasten.appendChild(el("div",{class:"knopfreihe",style:"margin-top:12px"},[
          el("button",{class:"knopf",text:"Weiter",onclick:() => frageFertig(wo)})
        ]));
      }
    }}));
  });
  return kasten;
}

function frageFertig(wo){
  const s = stufe();
  const liste = wo === "vorher" ? s.vorher : s.danach;
  if(zustand.frageNr < liste.length - 1){
    zustand.frageNr++;
    zeichnen();
    return;
  }
  if(wo === "vorher"){
    zustand.phase = "zeichnen";
    zustand.frageNr = 0;
    zeichnen();
  } else {
    naechsteStufe();
  }
}

function weiter(){
  const s = stufe();
  if(s.danach && s.danach.length){
    zustand.phase = "danach";
    zustand.frageNr = 0;
    zeichnen();
  } else {
    naechsteStufe();
  }
}

function naechsteStufe(){
  if(zustand.index >= STUFEN.length - 1){
    zustand.ansicht = "aufloesung";
    zeichnen();
    return;
  }
  stufeStarten(zustand.index + 1);
}

function stufeStarten(i){
  zustand.index = i;
  const s = stufe();
  zustand.phase = (s.vorher && s.vorher.length) ? "vorher" : "zeichnen";
  zustand.frageNr = 0;
  zustand.benutzt = new Set();
  zustand.pfad = [];
  zustand.aktuell = null;
  zustand.zieht = false;
  zustand.gezaehlt = false;
  zustand.zaehlmodus = false;
  zustand.geloest = false;
  zustand.meldung = null;
  if(!(s.id in zustand.versuche)) zustand.versuche[s.id] = 0;
  zeichnen();
}

/* =======================================================================
   AUFGABE 7: EIGENES NETZ BAUEN
   ======================================================================= */

function bauFeld(){
  const feld = el("div",{class:"feld"});
  const svg = svgEl("svg",{viewBox:"0 0 100 100",class:"zeichenflaeche"});
  const leiste = el("div",{class:"werkzeugleiste"});
  refs.svgInhalt = () => { fuelleBauSVG(svg); fuelleBauLeiste(leiste); };
  fuelleBauSVG(svg);
  fuelleBauLeiste(leiste);
  bauZeigerLogik(svg);
  feld.appendChild(svg);
  const aussen = el("div",{});
  aussen.appendChild(leiste);
  aussen.appendChild(feld);
  refs.meldung = meldungsZeile();
  aussen.appendChild(refs.meldung);
  return aussen;
}

function fuelleBauSVG(svg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const g = grade(zustand.bauKnoten,zustand.bauKanten);

  zustand.bauKanten.forEach(([a,b]) => {
    svg.appendChild(svgEl("line",{
      x1:zustand.bauKnoten[a][0],y1:zustand.bauKnoten[a][1],
      x2:zustand.bauKnoten[b][0],y2:zustand.bauKnoten[b][1],class:"kante-tinte"
    }));
  });
  if(zustand.zieht && zustand.aktuell !== null && zustand.zeigerXY){
    svg.appendChild(svgEl("line",{
      x1:zustand.bauKnoten[zustand.aktuell][0],y1:zustand.bauKnoten[zustand.aktuell][1],
      x2:zustand.zeigerXY[0],y2:zustand.zeigerXY[1],class:"gummiband"
    }));
  }
  zustand.bauKnoten.forEach(([x,y],i) => {
    svg.appendChild(svgEl("circle",{cx:x,cy:y,r:2.3,class:"knoten" + (zustand.aktuell === i ? " hier" : "")}));
    if(g[i] > 0){
      const t = svgEl("text",{x:x + 5,y:y - 3.6,class:"gradzahl" + (g[i] % 2 ? " ungerade" : "")});
      t.textContent = g[i];
      svg.appendChild(t);
    }
  });

}

function fuelleBauLeiste(leiste){
  while(leiste.firstChild) leiste.removeChild(leiste.firstChild);
  const g = grade(zustand.bauKnoten,zustand.bauKanten);
  ["punkt","strich"].forEach(modus => {
    leiste.appendChild(el("button",{
      class:"knopf leer" + (zustand.bauModus === modus ? " aktiv" : ""),
      text:modus === "punkt" ? "Punkt setzen" : "Strich ziehen",
      onclick:() => { zustand.bauModus = modus; aktualisieren(); }
    }));
  });
  const u = g.filter(d => d % 2 === 1).length;
  leiste.appendChild(el("div",{class:"ablesung",
    html:"Punkte: " + zustand.bauKnoten.length + " &middot; Striche: " + zustand.bauKanten.length +
         " &middot; ungerade: <span>" + u + "</span>"}));
}

function bauZeigerLogik(svg){
  const zuViewBox = (evt) => {
    const r = svg.getBoundingClientRect();
    return [(evt.clientX - r.left) / r.width * 100,(evt.clientY - r.top) / r.height * 100];
  };
  const knotenBei = ([x,y]) => {
    let treffer = null, best = 7;
    zustand.bauKnoten.forEach(([kx,ky],i) => {
      const d = Math.hypot(kx - x,ky - y);
      if(d < best){ best = d; treffer = i; }
    });
    return treffer;
  };

  svg.addEventListener("pointerdown",(e) => {
    const p = zuViewBox(e);
    const k = knotenBei(p);
    e.preventDefault();
    if(zustand.bauModus === "punkt"){
      if(k === null && zustand.bauKnoten.length < 14){
        zustand.bauKnoten.push([Math.round(p[0]),Math.round(p[1])]);
        zustand.meldung = null;
      }
    } else if(k !== null){
      svg.setPointerCapture(e.pointerId);
      zustand.zieht = true;
      zustand.aktuell = k;
    }
    aktualisieren();
  });
  svg.addEventListener("pointermove",(e) => {
    if(!zustand.zieht) return;
    zustand.zeigerXY = zuViewBox(e);
    aktualisieren();
  });
  svg.addEventListener("pointerup",(e) => {
    if(zustand.zieht && zustand.aktuell !== null){
      const k = knotenBei(zuViewBox(e));
      if(k !== null && k !== zustand.aktuell){
        const da = zustand.bauKanten.some(([a,b]) =>
          (a === zustand.aktuell && b === k) || (b === zustand.aktuell && a === k));
        if(!da) zustand.bauKanten.push([zustand.aktuell,k]);
      }
    }
    zustand.zieht = false;
    zustand.aktuell = null;
    zustand.zeigerXY = null;
    aktualisieren();
  });
}

function bauPruefen(){
  const k = zustand.bauKnoten, e = zustand.bauKanten;
  const u = ungeradeAnzahl(k,e);
  let fehler = null;
  if(k.length < 6) fehler = "Noch zu klein: Du brauchst mindestens sechs Punkte.";
  else if(e.length < 8) fehler = "Noch zu wenige Striche: Es müssen mindestens acht sein.";
  else if(!zusammenhaengend(k,e)) fehler = "Das Netz hängt noch nicht zusammen. Jeder Punkt muss über Striche erreichbar sein.";
  else if(u !== 4) fehler = "Dein Netz hat " + u + " ungerade Punkte. Gefordert sind genau vier.";
  if(fehler){
    zustand.bauFertig = false;
    zustand.meldung = {art:"stockt",text:fehler};
    zeichnen();
    return;
  }
  if(zustand.bauFertig) return;
  antwortSpeichern("s7",{frage:"Eigenes Netz",antwort:k.length + " Punkte, " + e.length + " Striche, 4 ungerade Punkte",richtig:true});
  zustand.meldung = {art:"gut",text:"Das Netz erfüllt alle Bedingungen – niemand schafft es in einem Zug."};
  zustand.bauFertig = true;
  zeichnen();
}

/* =======================================================================
   AUFLÖSUNG
   ======================================================================= */

function aufloesungsSeite(){
  const wrap = el("div",{class:"aufloesung"});
  wrap.appendChild(el("header",{},[el("div",{},[
    el("h1",{text:"Auflösung"}),
    el("p",{class:"untertitel",text:"Was du in den letzten Minuten gemacht hast, hat einen Namen."})
  ])]));

  const karte = el("div",{class:"karte",style:"margin-top:26px"});
  karte.appendChild(el("p",{text:"Du hast keine Zeichenrätsel gelöst, sondern Graphen untersucht. Ein Graph ist das mathematische Modell hinter jedem Netz aus Verbindungen: Straßen, Leitungen, Stromnetze, Freundeslisten, Bahnpläne. Die Fachbegriffe für das, was du benutzt hast:"}));
  const liste = el("ul",{class:"begriffe"});
  [["Knoten","Deine Punkte."],
   ["Kante","Deine Striche – eine Verbindung zwischen zwei Knoten."],
   ["Grad eines Knotens","Die Anzahl der Kanten, die an ihm zusammenlaufen. Genau das hat das Zähl-Werkzeug angezeigt."],
   ["Eulerweg","Ein Weg, der jede Kante genau einmal benutzt. Das war in jeder Aufgabe die Zielvorgabe."],
   ["Satz von Euler","Ein Eulerweg existiert genau dann, wenn der Graph zusammenhängt und null oder zwei Knoten ungeraden Grades besitzt. Bei zwei ungeraden Knoten muss der Weg an einem davon beginnen und am anderen enden."]
  ].forEach(([b,t]) => liste.appendChild(el("li",{},[el("b",{text:b}),el("span",{text:t})])));
  karte.appendChild(liste);
  karte.appendChild(el("p",{style:"margin-top:20px",text:"Leonhard Euler hat diese Regel 1736 aufgestellt – an der Frage, ob man in Königsberg alle sieben Brücken der Stadt in einem Rundgang überqueren kann, ohne eine zweimal zu benutzen. Er konnte nicht nur zeigen, dass es nicht geht, sondern auch warum. Damit war die Graphentheorie geboren. Heute steckt sie in Navigationsgeräten, in Routen der Müllabfuhr und Straßenreinigung, in Netzwerkprotokollen und in der Empfehlung „Personen, die du vielleicht kennst“."}));
  wrap.appendChild(karte);

  const prot = el("div",{class:"karte",style:"margin-top:22px"});
  prot.appendChild(el("h2",{text:"Dein Protokoll"}));
  const tab = el("table",{class:"protokoll"});
  const kopf = el("tr",{});
  ["Aufgabe","Versuche","Deine Antworten"].forEach(t => kopf.appendChild(el("th",{text:t})));
  tab.appendChild(kopf);
  STUFEN.forEach(s => {
    const zeile = el("tr",{});
    zeile.appendChild(el("td",{text:s.level + (s.teil ? "." + s.teil.charAt(0) : "") + " – " + s.titel}));
    zeile.appendChild(el("td",{class:"n",text:String(versucheVon(s.id) || 0)}));
    const ant = (zustand.antworten[s.id] || []).map(a =>
      (a.richtig === null ? "" : (a.richtig ? "✓ " : "✗ ")) + a.antwort).join(" · ");
    zeile.appendChild(el("td",{text:ant || "—"}));
    tab.appendChild(zeile);
  });
  prot.appendChild(tab);
  prot.appendChild(el("div",{class:"knopfreihe keindruck",style:"margin-top:18px"},[
    el("button",{class:"knopf leer",text:"Protokoll drucken",onclick:() => window.print()}),
    el("button",{class:"knopf leer",text:"Von vorn beginnen",onclick:() => {
      zustand.versuche = {}; zustand.antworten = {}; zustand.bauKnoten = []; zustand.bauKanten = [];
      zustand.ansicht = "start"; zeichnen();
    }})
  ]));
  wrap.appendChild(prot);
  app.appendChild(wrap);
}

zeichnen();
</script>
</body>
</html>
